name: Release

# Builds a universal, Developer ID–signed, notarized Cove.app and publishes a
# Sparkle update feed entry (L1). Triggered by pushing a tag like v0.1.0.
#
# Required secrets:
#   MACOS_CERTIFICATE_P12        base64 Developer ID Application certificate (.p12)
#   MACOS_CERTIFICATE_PASSWORD   its password
#   CODESIGN_IDENTITY            e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password)
#   SPARKLE_PUBLIC_KEY, SPARKLE_PRIVATE_KEY (from Sparkle's generate_keys)

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Store notary credentials
        run: |
          xcrun notarytool store-credentials cove-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}"

      - name: Build, sign, notarize
        env:
          VERSION: ${{ github.ref_name }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          NOTARY_PROFILE: cove-notary
          UNIVERSAL: "1"
        run: |
          export VERSION="${VERSION#v}"
          scripts/bundle-app.sh

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_BIN="$(find Apps/CoveMac/.build -type d -path '*Sparkle*/bin' | head -1)"
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          "$SPARKLE_BIN/generate_appcast" --ed-key-file "$RUNNER_TEMP/sparkle_key" dist/
          rm "$RUNNER_TEMP/sparkle_key"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cove-*.zip
            dist/appcast.xml
