name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast: the shared libraries build and test on Linux.
  linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift build
      - run: swift test --parallel

  # Full: libraries + macOS app (AppKit, ScreenCaptureKit, Speech, Sparkle).
  macos:
    name: macOS build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - run: swift --version
      - name: Test libraries
        run: swift test --parallel
      - name: Build app
        run: swift build -c release --package-path Apps/CoveMac
      - name: Bundle (ad-hoc signed)
        run: scripts/bundle-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cove-app
          path: dist/Cove-*.zip
          retention-days: 7
